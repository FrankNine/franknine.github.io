<p>Jeff Russell 寫了一篇關於基於物理的材質不錯的 <a href="https://marmoset.co/posts/basic-theory-of-physically-based-rendering/">概論</a>has a good overview(<a href="http://www.marmoset.co/toolbag/learn/pbr-theory">http://www.marmoset.co/toolbag/learn/pbr-theory</a>) 裡面還有更多資源的連結。</p>
<p>譯註：能量守恆要求主要不是在展現新的效果，而是工作流程上的統一。在能量不守恆的系統，跨越多場景的模型，例如主角。會很容易在一個場景調整好材質參數，結果在別的場景環境看起來太亮或太暗。</p>
