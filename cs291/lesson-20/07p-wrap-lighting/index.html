  <script>
    document.addEventListener("DOMContentLoaded", function () {
      var editor = CodeMirror.fromTextArea(document.getElementById("editor"), {
        lineNumbers: true,
        mode: "javascript",
        theme: "default"
      });

      var frame = document.getElementById("preview");
      var doc = frame.contentDocument || frame.contentWindow.document;

      editor.on("change", function (instance) {
        var content = instance.getValue();
        updatePreview(content);
      });

      editor.setSize(null, document.body.clientHeight)

      function updatePreview(scriptContent) {
        var fullHTML = `
            <!DOCTYPE html>
            <html>
            <head>
                \r\n\u003cscript src=\u0022\/js\/cs291\/lib\/three.min.js\u0022\u003e\u003c\/script\u003e\r\n\u003cscript src=\u0022\/js\/cs291\/lib\/jquery-1.8.3.min.js\u0022\u003e\u003c\/script\u003e\r\n\u003cscript src=\u0022\/js\/cs291\/lib\/Coordinates.js\u0022\u003e\u003c\/script\u003e\r\n\u003cscript src=\u0022\/js\/cs291\/lib\/OrbitAndPanControls.js\u0022\u003e\u003c\/script\u003e\r\n\u003cscript src=\u0022\/js\/cs291\/lib\/dat.gui.min.js\u0022\u003e\u003c\/script\u003e\r\n\u003cscript src=\u0022\/js\/cs291\/lib\/uclass_BeveledBlockGeometry.js\u0022\u003e\u003c\/script\u003e\r\n\u003cscript src=\u0022\/js\/cs291\/lib\/uclass_TeapotGeometry.js\u0022\u003e\u003c\/script\u003e\r\n
                \x3Cscript>
                    try {
                            ${scriptContent}
                        } catch (e) {
                            console.error(e);
                        }
                <\/script>
            </head>
            <body style="margin: 0; padding: 0; overflow: hidden">
                <div id="container"></div>
            </body>
            </html>
        `;

        doc.open();
        try {
          doc.write(fullHTML);
        } catch (e) {
          console.error(e);
        }
        doc.close();
      }

      updatePreview(editor.getValue());
    });
  </script>

<body style="height: 100%; margin: 0">
  <div style="display: flex; flex-direction: row; height: 100vh">
    <form style="width:50%">
      
        <textarea id="editor">
&#34;use strict&#34;; // 參考 https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Strict_mode
////////////////////////////////////////////////////////////////////////////////
// 環繞光照
////////////////////////////////////////////////////////////////////////////////

var camera, scene, renderer;
var cameraControls;
var effectController;
var clock = new THREE.Clock();
var teapotSize = 600;
var tess = -1;	// 強制初始化
var ambientLight, light;
var teapot;
var phongBalancedMaterial;

var vertexShader = `
	varying vec3 vNormal;
	varying vec3 vViewPosition;

	void main() {
		gl_Position = projectionMatrix * modelViewMatrix * vec4( position, 1.0 );
		vNormal = normalize( normalMatrix * normal );
		vec4 mvPosition = modelViewMatrix * vec4( position, 1.0 );
		vViewPosition = -mvPosition.xyz;
	}
`

var fragmentShader = `
	uniform vec3 uMaterialColor;
	uniform vec3 uSpecularColor;

	uniform vec3 uDirLightPos;
	uniform vec3 uDirLightColor;

	uniform vec3 uAmbientLightColor;

	uniform float uKd;
	uniform float uKs;
	uniform float shininess;

	uniform float uWrap;

	varying vec3 vNormal;
	varying vec3 vViewPosition;

	void main() {
		// 環境光
		gl_FragColor = vec4( uAmbientLightColor, 1.0 );

		// 計算往光源的方向
		vec4 lDirection = viewMatrix * vec4( uDirLightPos, 0.0 );
		vec3 lVector = normalize( lDirection.xyz );

		// 法向量必須正規化，因為經過內插計算
		vec3 normal = normalize( vNormal );

		// 漫射：N * L
		// 學生作業：修改這裡使用環繞光照，環繞值以 uWrap 傳入
		float diffuse = max( dot( normal, lVector ), 0.0 );

		// 這樣可能會切斷高光，但是比奇怪的閃爍好
		if (diffuse &lt;= 0.0) {
			return;
		}

		gl_FragColor.rgb &#43;= uKd * uMaterialColor * uDirLightColor * diffuse;

		// 鏡面反射：N * H 的指數。H 是往光的向量加上往攝影機的向量正規化
		vec3 viewPosition = normalize( vViewPosition );
		vec3 pointHalfVector = normalize( lVector &#43; viewPosition );
		float pointDotNormalHalf = max( dot( normal, pointHalfVector ), 0.0 );
		float specular = pow( pointDotNormalHalf, shininess );
		specular *= diffuse*(2.0 &#43; shininess)/8.0;

		gl_FragColor.rgb &#43;= uDirLightColor * uSpecularColor * uKs * specular;
	}
`

function init() {
	canvasWidth = window.innerWidth;
	canvasHeight = window.innerHeight;
	var canvasRatio = canvasWidth/canvasHeight;

	// 光源
	ambientLight = new THREE.AmbientLight(0x333333); // 0.2
	light = new THREE.DirectionalLight(0xffffff, 1.0);
	light.position.set(700, 3000, 1200);

	// RENDERER
	renderer = new THREE.WebGLRenderer({ antialias: true });
	renderer.setSize(canvasWidth, canvasHeight);
	renderer.setClearColorHex(0xAAAAAA, 1.0);
	renderer.gammaInput = true;
	renderer.gammaOutput = true;

	// 攝影機
	camera = new THREE.PerspectiveCamera(45, canvasRatio, 1, 80000);
	camera.position.set(-1388, 5, 1726);

	// 控制
	cameraControls = new THREE.OrbitAndPanControls(camera, renderer.domElement);
	cameraControls.target.set(0, -636, 0);

	// 材質
	// 筆記：將「逐像素」關閉不會影響鏡面高光
	// 只會影響「往光的方向」會不會逐像素計算
	var materialColor = new THREE.Color();
	materialColor.setRGB(1.0, 0.8, 0.6);

	phongBalancedMaterial = createShaderMaterial(&#34;phongBalanced&#34;, light, ambientLight);
	phongBalancedMaterial.uniforms.uMaterialColor.value.copy(materialColor);
	phongBalancedMaterial.side = THREE.DoubleSide;
}

function createShaderMaterial(id, light, ambientLight) {
	var shaderTypes = {
		&#39;phongBalanced&#39; : {
			uniforms: {
				&#34;uDirLightPos&#34;:	{ type: &#34;v3&#34;, value: new THREE.Vector3() },
				&#34;uDirLightColor&#34;: { type: &#34;c&#34;, value: new THREE.Color( 0xffffff ) },
				&#34;uAmbientLightColor&#34;: { type: &#34;c&#34;, value: new THREE.Color( 0x050505 ) },
				&#34;uMaterialColor&#34;:  { type: &#34;c&#34;, value: new THREE.Color( 0xffffff ) },
				&#34;uSpecularColor&#34;:  { type: &#34;c&#34;, value: new THREE.Color( 0xffffff ) },
				uKd: {
					type: &#34;f&#34;,
					value: 0.7
				},
				uKs: {
					type: &#34;f&#34;,
					value: 0.3
				},
				shininess: {
					type: &#34;f&#34;,
					value: 100.0
				},
				uWrap: {
					type: &#34;f&#34;,
					value: 0.5
				}
			}
		}
	};

	var shader = shaderTypes[id];

	var u = THREE.UniformsUtils.clone(shader.uniforms);

	var vs = vertexShader;
	var fs = fragmentShader;

	var material = new THREE.ShaderMaterial({ uniforms: u, vertexShader: vs, fragmentShader: fs });
	material.uniforms.uDirLightPos.value = light.position;
	material.uniforms.uDirLightColor.value = light.color;
	material.uniforms.uAmbientLightColor.value = ambientLight.color;

	return material;
}

function setupGui() {
	effectController = {
		shininess: 100.0,
		wrap: 0.5,
		ka: 0.01,
		kd: 1.0,
		ks: 0.01,
		metallic: false,

		hue: 0.09,
		saturation: 0.46,
		lightness: 0.7,

		lhue: 0.04,
		lsaturation: 0.0,
		llightness: 0.7,

		// 奇怪的是如果你以負數初始化，這些滑桿不會顯示小數位
		lx: 0.65,
		ly: 0.43,
		lz: 0.35,
		newTess: 10
	};

	var h;

	var gui = new dat.GUI();

	// 材質（屬性）
	h = gui.addFolder(&#34;材質控制&#34;);
	h.add(effectController, &#34;wrap&#34;, 0.0, 1.0, 0.025).name(&#34;環繞&#34;);
	h.add(effectController, &#34;shininess&#34;, 1.0, 1000.0, 1.0).name(&#34;閃亮程度&#34;);
	h.add(effectController, &#34;ka&#34;, 0.0, 1.0, 0.025).name(&#34;環境光係數&#34;);
	h.add(effectController, &#34;kd&#34;, 0.0, 1.0, 0.025).name(&#34;漫射係數&#34;);
	h.add(effectController, &#34;ks&#34;, 0.0, 1.0, 0.025).name(&#34;閃亮程度係數&#34;);
	h.add(effectController, &#34;metallic&#34;).name(&#34;金屬色澤&#34;);
	h.add(effectController, &#34;newTess&#34;, [2,3,4,5,6,8,10,12,16,24,32] ).name(&#34;鑲嵌等級&#34;);

	// 材質（顏色）
	h = gui.addFolder(&#34;材質顏色&#34;);
	h.add(effectController, &#34;hue&#34;, 0.0, 1.0, 0.025).name(&#34;色相&#34;);
	h.add(effectController, &#34;saturation&#34;, 0.0, 1.0, 0.025).name(&#34;飽和度&#34;);
	h.add(effectController, &#34;lightness&#34;, 0.0, 1.0, 0.025).name(&#34;明度&#34;);

	// 光源（顏色）
	h = gui.addFolder(&#34;光源顏色&#34;);
	h.add(effectController, &#34;lhue&#34;, 0.0, 1.0, 0.025).name(&#34;色相&#34;);
	h.add(effectController, &#34;lsaturation&#34;, 0.0, 1.0, 0.025).name(&#34;飽和度&#34;);
	h.add(effectController, &#34;llightness&#34;, 0.0, 1.0, 0.025).name(&#34;明度&#34;);

	// 光源（方向）
	h = gui.addFolder(&#34;光源方向&#34;);
	h.add(effectController, &#34;lx&#34;, -1.0, 1.0, 0.025).name(&#34;X&#34;);
	h.add(effectController, &#34;ly&#34;, -1.0, 1.0, 0.025).name(&#34;Y&#34;);
	h.add(effectController, &#34;lz&#34;, -1.0, 1.0, 0.025).name(&#34;Z&#34;);
}

function animate() {
	requestAnimationFrame(animate);
	render();
}

function render() {
	var delta = clock.getDelta();

	cameraControls.update(delta);

	if (effectController.newTess !== tess ) {
		tess = effectController.newTess;

		fillScene();
	}

	phongBalancedMaterial.uniforms.uWrap.value = effectController.wrap;
	phongBalancedMaterial.uniforms.shininess.value = effectController.shininess;
	phongBalancedMaterial.uniforms.uKd.value = effectController.kd;
	phongBalancedMaterial.uniforms.uKs.value = effectController.ks;

	var materialColor = new THREE.Color();
	materialColor.setHSL(effectController.hue, effectController.saturation, effectController.lightness);
	phongBalancedMaterial.uniforms.uMaterialColor.value.copy(materialColor);

	if (!effectController.metallic) {
		materialColor.setRGB(1, 1, 1);
	}
	phongBalancedMaterial.uniforms.uSpecularColor.value.copy(materialColor);

	// 環境光只是材質的顏色乘上 ka，無關光源的顏色
	ambientLight.color.setHSL(effectController.hue, effectController.saturation, effectController.lightness * effectController.ka);

	light.position.set(effectController.lx, effectController.ly, effectController.lz);

	light.color.setHSL(effectController.lhue, effectController.lsaturation, effectController.llightness);

	renderer.render(scene, camera);
}

function fillScene() {
	scene = new THREE.Scene();
	scene.fog = new THREE.Fog(0x808080, 2000, 4000);

	scene.add(camera);

	scene.add(ambientLight);
	scene.add(light);

	teapot = new THREE.Mesh(
		new THREE.TeapotGeometry(teapotSize, tess, true, true, true, true), phongBalancedMaterial);
	teapot.position.y = -teapotSize;

	scene.add(teapot);
}

function addToDOM() {
	var container = document.getElementById(&#39;container&#39;);
	var canvas = container.getElementsByTagName(&#39;canvas&#39;);
	if (canvas.length&gt;0) {
		container.removeChild(canvas[0]);
	}
	container.appendChild( renderer.domElement );
}

document.addEventListener(&#34;DOMContentLoaded&#34;, function () {
	try {
		init();
		fillScene();
		setupGui();
		addToDOM();
		animate();
	} catch(e) {
		var errorReport = &#34;你的程式遇到不可復原的錯誤，無法繪製 Canvas。錯誤是：&lt;br/&gt;&lt;br/&gt;&#34;;
		$(&#39;#container&#39;).append(errorReport&#43;e);
	}
})
</textarea>
      
    </form>
    <iframe id="preview" src="about:blank" style="flex-grow: 1"></iframe>
  </div>
