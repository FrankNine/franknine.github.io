<p>這個公式還能推出另一個有趣的結果：當網格的三角形越來越多（而且沒有增加洞），三角形與頂點的數量比會趨近 2 比 1。從「移除一個頂點會同時移除兩個三角形」這一點，就能看出其中的道理。</p>
<p>不論三角形和頂點的形狀或連接方式如何，這個比例都成立。由此可以推得一個推論：隨著網格規模變大，交會於單一頂點的三角形平均數量通常會趨近 6 個。</p>
