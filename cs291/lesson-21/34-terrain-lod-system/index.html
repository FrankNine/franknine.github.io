<p>還有另一種剔除方式，叫做遮擋剔除（Occlusion Culling）。以遮擋剔除為基礎的演算法會進行測試，快速判斷一個物體是否被場景中的其他物體完全遮住。免費的 GPU Gems <a href="https://developer.nvidia.com/gpugems/gpugems/contributors">系列書籍</a>中，有兩篇文章討論以 GPU 為基礎的遮擋剔除，分別在 <a href="https://developer.nvidia.com/gpugems/gpugems/part-v-performance-and-practicalities/chapter-29-efficient-occlusion-culling">這裡</a> 和 <a href="https://developer.nvidia.com/gpugems/gpugems2/part-i-geometric-complexity/chapter-6-hardware-occlusion-queries-made-useful">這裡</a>。另外還有許多其他的遮擋技術，例如這個用於球體的 <a href="https://web.archive.org/web/20130618060247/http://blogs.agi.com/insight3d/index.php/2009/03/25/horizon-culling-2/">技術</a>。</p>
