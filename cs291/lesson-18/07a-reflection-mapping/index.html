<p>解答：修改 fillScene() 的 teapotMaterial：</p>
<pre tabindex="0"><code>var teapotMaterial = new THREE.MeshPhongMaterial(
	{ color: 0x770000, specular:0xffaaaa, 
	envMap: textureCube } );
</code></pre><p>預設情況下，反射貼圖會與計算出的表面顏色相乘。你也可以透過 <code>combine</code> 參數，用其他方式混合這兩個結果，例如混合（Mixing）和相加（Addition）。可以參考這個展示的 <a href="https://threejs.org/examples/#webgl_materials_car">程式碼</a>。</p>
