<p>要特別說明的是，Alpha 真正代表的是不透明度與覆蓋量的乘積。請注意，不要把 Alpha 只當成其中一種，因為它永遠是兩者的乘積。例如，如果你的貼圖是半透明的，Alpha 為 0.8，而某個像素有 0.3 被這個貼上貼圖的多邊形覆蓋（假設你能算出這個值），那麼把這兩個數相乘，就會得到最終的 Alpha 值 0.24。</p>
