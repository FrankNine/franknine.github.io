<p>想進一步了解 WebGL 在貼圖方面的安全性問題及處理方式，請參考 <a href="https://hacks.mozilla.org/2011/11/using-cors-to-load-webgl-textures-from-cross-domain-images/">這篇</a> 和 <a href="https://blog.chromium.org/2011/07/using-cross-domain-images-in-webgl-and.html">這篇</a> 文章。若要在瀏覽器上於本機執行貼圖示範，你需要設定一些權限，或 <a href="https://www.realtimerendering.com/blog/setting-up-a-windows-server-for-webgl/">架設本機伺服器</a>。</p>
