<p>試試看我展示的 <a href="https://threejs.org/examples/#webgl_geometries">Three.js Demo</a>，觀察最新的 UV 映射。有人修正了圓錐體底部的問題。如果你想嘗試提交修正給 Three.js，可以在 <a href="https://github.com/mrdoob/three.js/wiki">FAQ</a> 找到流程。</p>
<p>要觀察 Three.js 自動映射或是這單元提到的其它上貼圖方式，一定要試試 <a href="https://mrdoob.github.com/three.js/editor/">線上編輯器</a>。載入一盞方向燈、物件，然後開始隨心所欲地上貼圖吧。</p>
<p>譯註：Geometry 類別和 faceVertexUvs 在 r125 版之後已經移除，現在改用 BufferGeometry 的 uv 屬性。</p>
